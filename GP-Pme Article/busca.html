<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GP-PME — Busca Inteligente</title>
<meta name="description" content="Busca lexical offline sobre o framework GP-PME: guias, templates e materiais dos 4 pilares." />

<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-card: rgba(255, 255, 255, 0.85);
    --surface-hover: #eef0f4;
    --border: rgba(20, 24, 32, 0.10);
    --text: #14161a;
    --text-muted: #565d6b;
    --accent-gov: #0b6fd6;
    --accent-exe: #0f8c4c;
    --accent-sec: #a2650a;
    --accent-ai: #6b2fc9;
    --mark-bg: #ffe58a;
    --mark-fg: #3a2c00;
    --shadow: 0 8px 30px rgba(20, 24, 32, 0.08);
    --radius: 0.9rem;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131314;
      --surface: #1b1b1c;
      --surface-card: rgba(35, 47, 60, 0.55);
      --surface-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(61, 78, 96, 0.35);
      --text: #e4e2e2;
      --text-muted: #bec9d5;
      --accent-gov: #1aa3ff;
      --accent-exe: #19cc6d;
      --accent-sec: #f29d0d;
      --accent-ai: #8e44ff;
      --mark-bg: rgba(255, 213, 80, 0.35);
      --mark-fg: #ffe58a;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
  }

  header.top {
    text-align: center;
    margin-bottom: 2rem;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--accent-gov);
    background: color-mix(in srgb, var(--accent-gov) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent-gov) 25%, transparent);
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    margin-bottom: 1rem;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-gov);
  }

  h1 {
    font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 800;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    max-width: 42rem;
    margin: 0 auto;
    line-height: 1.5;
  }

  .search-panel {
    background: var(--surface-card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem;
    margin-top: 2rem;
  }

  .search-input-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.7rem;
    padding: 0.35rem 0.5rem 0.35rem 0.9rem;
  }
  .search-input-row:focus-within {
    border-color: var(--accent-gov);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-gov) 20%, transparent);
  }

  .search-input-row svg { flex: none; opacity: 0.6; }

  #q {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 1.05rem;
    padding: 0.6rem 0;
    font-family: inherit;
  }
  #q::placeholder { color: var(--text-muted); }

  #clear-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 0.3rem 0.5rem;
    border-radius: 0.4rem;
    visibility: hidden;
  }
  #clear-btn.visible { visibility: visible; }
  #clear-btn:hover { background: var(--surface-hover); color: var(--text); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-top: 0.9rem;
  }

  .filters select {
    appearance: none;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 0.55rem;
    padding: 0.45rem 1.8rem 0.45rem 0.75rem;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) calc(1em + 1px), calc(100% - 9px) calc(1em + 1px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .filters select:focus { outline: none; border-color: var(--accent-gov); }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 1.5rem 0 0.75rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .results { display: flex; flex-direction: column; gap: 0.85rem; }

  .result-card {
    display: block;
    background: var(--surface-card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-left: 3px solid var(--pilar-color, var(--accent-gov));
    border-radius: 0.7rem;
    padding: 1rem 1.2rem;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .result-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: color-mix(in srgb, var(--pilar-color, var(--accent-gov)) 45%, var(--border));
  }

  .breadcrumb {
    font-size: 0.72rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 0.35rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 0.12rem 0.5rem;
    border-radius: 999px;
    color: #fff;
    background: var(--pilar-color, var(--accent-gov));
    letter-spacing: 0.01em;
  }

  .badge-tipo {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .result-title {
    font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.02rem;
    margin: 0 0 0.35rem;
  }

  .result-doc {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }

  .snippet {
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--text);
  }
  .snippet mark {
    background: var(--mark-bg);
    color: var(--mark-fg);
    padding: 0 0.15em;
    border-radius: 0.2em;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .empty-state strong { color: var(--text); }

  footer.site {
    text-align: center;
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  #status-banner {
    display: none;
    background: color-mix(in srgb, var(--accent-sec) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent-sec) 35%, transparent);
    color: var(--text);
    border-radius: 0.6rem;
    padding: 0.75rem 1rem;
    font-size: 0.85rem;
    margin-bottom: 1.25rem;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <span class="eyebrow"><span class="dot"></span>GP-PME Framework</span>
    <h1>Busca Inteligente</h1>
    <p class="subtitle">Encontre guias, templates e materiais dos 4 pilares em segundos — busca 100% local, sem servidor.</p>
  </header>

  <div id="status-banner"></div>

  <div class="search-panel">
    <div class="search-input-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="text" placeholder="Buscar por termo, ex: kanban, MFA, WIP, ADM-Lite..." autocomplete="off" autofocus />
      <button id="clear-btn" type="button" aria-label="Limpar busca">&times;</button>
    </div>
    <div class="filters">
      <select id="f-pilar" aria-label="Filtrar por pilar">
        <option value="">Todos os pilares</option>
        <option value="1">Pilar 1 — Governança</option>
        <option value="2">Pilar 2 — Execução Ágil</option>
        <option value="3">Pilar 3 — Segurança</option>
        <option value="4">Pilar 4 — Aceleração por IA</option>
      </select>
      <select id="f-tipo" aria-label="Filtrar por tipo">
        <option value="">Todos os tipos</option>
        <option value="guia">Guia</option>
        <option value="template">Template</option>
        <option value="master">Master</option>
        <option value="dummies">Dummies</option>
      </select>
    </div>
  </div>

  <div class="meta-row">
    <span id="result-count"></span>
    <span id="index-meta"></span>
  </div>

  <div id="results" class="results"></div>

  <footer class="site">GP-PME Framework — Busca Inteligente</footer>
</div>

<script src="search-data.js"></script>
<script>
(function () {
  "use strict";

  // ---------- 1. Carregamento dos dados (script local; fallback fetch p/ http) ----------
  var PILAR_COLOR = {
    "1": "var(--accent-gov)",
    "2": "var(--accent-exe)",
    "3": "var(--accent-sec)",
    "4": "var(--accent-ai)"
  };
  var PILAR_LABEL = { "1": "Pilar 1", "2": "Pilar 2", "3": "Pilar 3", "4": "Pilar 4" };

  var els = {
    q: document.getElementById("q"),
    clear: document.getElementById("clear-btn"),
    fPilar: document.getElementById("f-pilar"),
    fTipo: document.getElementById("f-tipo"),
    results: document.getElementById("results"),
    count: document.getElementById("result-count"),
    meta: document.getElementById("index-meta"),
    banner: document.getElementById("status-banner")
  };

  function showBanner(msg) {
    els.banner.textContent = msg;
    els.banner.style.display = "block";
  }

  function iniciar(payload) {
    if (!payload || !Array.isArray(payload.docs)) {
      showBanner("Índice de busca inválido ou vazio.");
      return;
    }
    els.meta.textContent = payload.docs.length + " trechos indexados" +
      (payload.gerado_em ? " · gerado em " + payload.gerado_em.slice(0, 10) : "");
    var engine = construirIndice(payload.docs);
    ligarEventos(engine, payload.docs);
    renderizarEstadoInicial(payload.docs.length);
  }

  if (window.GPPME_INDEX) {
    iniciar(window.GPPME_INDEX);
  } else if (window.fetch) {
    // ponytail: sem window.GPPME_INDEX (ex.: search-data.js ausente), tenta fetch --
    // só funciona quando a página é servida via http(s), não via file://.
    fetch("search-index.json")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(iniciar)
      .catch(function () {
        showBanner("Não foi possível carregar o índice de busca. Rode 'python -m search.export_web' para gerá-lo, ou abra esta página via um servidor local.");
      });
  } else {
    showBanner("Não foi possível carregar o índice de busca (search-data.js ausente).");
  }

  // ---------- 2. Tokenização (accent-insensitive, tamanho preservado p/ highlight) ----------
  function normalizarMesmoTamanho(s) {
    return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }
  function tokenizar(s) {
    return normalizarMesmoTamanho(s).split(/[^a-z0-9]+/).filter(Boolean);
  }

  // ---------- 3. Índice invertido simples com boost por campo ----------
  var BOOST = { texto: 1, secao: 2, titulo_doc: 2, keywords: 3 };

  function construirIndice(docs) {
    // postings: termo -> { idxDoc: peso }
    var postings = Object.create(null);
    docs.forEach(function (doc, i) {
      ["texto", "secao", "titulo_doc"].forEach(function (campo) {
        tokenizar(doc[campo]).forEach(function (termo) {
          registrar(termo, i, BOOST[campo]);
        });
      });
      (doc.keywords || []).forEach(function (kw) {
        tokenizar(kw).forEach(function (termo) { registrar(termo, i, BOOST.keywords); });
      });
    });

    function registrar(termo, idx, peso) {
      if (!postings[termo]) postings[termo] = Object.create(null);
      postings[termo][idx] = (postings[termo][idx] || 0) + peso;
    }

    var vocab = Object.keys(postings);

    function buscar(query) {
      var termos = tokenizar(query);
      if (!termos.length) return [];
      var scores = Object.create(null);
      termos.forEach(function (termo) {
        var chaves = postings[termo] ? [termo] : vocab.filter(function (v) {
          return termo.length >= 3 && v.indexOf(termo) === 0;
        });
        chaves.forEach(function (chave) {
          var fator = chave === termo ? 1 : 0.6; // prefixo pesa menos que match exato
          var lista = postings[chave];
          for (var idxStr in lista) {
            scores[idxStr] = (scores[idxStr] || 0) + lista[idxStr] * fator;
          }
        });
      });
      return Object.keys(scores)
        .map(function (idxStr) { return { idx: Number(idxStr), score: scores[idxStr] }; })
        .sort(function (a, b) { return b.score - a.score; });
    }

    return { buscar: buscar, termosNormalizados: tokenizar };
  }

  // ---------- 4. Realce de trechos ----------
  function escaparHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function destacarTrecho(texto, termos) {
    if (!texto) return "";
    var norm = normalizarMesmoTamanho(texto);
    var ranges = [];
    termos.forEach(function (t) {
      if (!t) return;
      var start = 0, idx;
      while ((idx = norm.indexOf(t, start)) !== -1) {
        ranges.push([idx, idx + t.length]);
        start = idx + t.length;
      }
    });
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [];
    ranges.forEach(function (r) {
      var last = merged[merged.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else merged.push(r.slice());
    });

    var janela = 260;
    var start = 0, end = Math.min(texto.length, janela);
    if (merged.length) {
      start = Math.max(0, merged[0][0] - 60);
      end = Math.min(texto.length, merged[0][0] + janela);
    }

    var out = "", cursor = start;
    merged.forEach(function (r) {
      var s = Math.max(r[0], start), e = Math.min(r[1], end);
      if (e <= start || s >= end) return;
      if (s > cursor) out += escaparHtml(texto.slice(cursor, s));
      out += "<mark>" + escaparHtml(texto.slice(s, e)) + "</mark>";
      cursor = Math.max(cursor, e);
    });
    if (cursor < end) out += escaparHtml(texto.slice(cursor, end));
    return (start > 0 ? "…" : "") + out + (end < texto.length ? "…" : "");
  }

  // ---------- 5. Render ----------
  function linkRelativo(doc) {
    return "../" + doc.split("/").map(encodeURIComponent).join("/");
  }

  function renderizarEstadoInicial(totalDocs) {
    els.count.textContent = "";
    els.results.innerHTML =
      '<div class="empty-state">Digite um termo acima ou use os filtros para explorar os <strong>' +
      totalDocs + "</strong> trechos indexados do framework.</div>";
  }

  function renderizar(itens, termosDestaque) {
    if (!itens.length) {
      els.count.textContent = "0 resultados";
      els.results.innerHTML = '<div class="empty-state">Nenhum resultado encontrado. Tente outro termo ou remova os filtros.</div>';
      return;
    }
    els.count.textContent = itens.length + (itens.length === 1 ? " resultado" : " resultados");
    var frag = document.createDocumentFragment();
    itens.forEach(function (doc) {
      var a = document.createElement("a");
      a.className = "result-card";
      a.href = linkRelativo(doc.doc);
      a.target = "_blank";
      a.rel = "noopener";
      if (doc.pilar && PILAR_COLOR[doc.pilar]) a.style.setProperty("--pilar-color", PILAR_COLOR[doc.pilar]);

      var badges = "";
      if (doc.pilar && PILAR_LABEL[doc.pilar]) badges += '<span class="badge">' + PILAR_LABEL[doc.pilar] + "</span>";
      if (doc.tipo) badges += '<span class="badge badge-tipo">' + escaparHtml(doc.tipo) + "</span>";

      a.innerHTML =
        '<div class="breadcrumb">' + badges + "<span>" + escaparHtml(doc.breadcrumb || doc.titulo_doc || "") + "</span></div>" +
        '<div class="result-title">' + escaparHtml(doc.secao || doc.titulo_doc || "(sem título)") + "</div>" +
        '<div class="result-doc">' + escaparHtml(doc.titulo_doc || "") + "</div>" +
        '<div class="snippet">' + destacarTrecho(doc.texto || "", termosDestaque) + "</div>";

      frag.appendChild(a);
    });
    els.results.innerHTML = "";
    els.results.appendChild(frag);
  }

  // ---------- 6. Orquestração de busca + filtros ----------
  function ligarEventos(engine, docs) {
    var debounceTimer = null;

    function aplicarFiltros(lista) {
      var pilar = els.fPilar.value, tipo = els.fTipo.value;
      return lista.filter(function (doc) {
        if (pilar && doc.pilar !== pilar) return false;
        if (tipo && doc.tipo !== tipo) return false;
        return true;
      });
    }

    function executar() {
      var query = els.q.value.trim();
      els.clear.classList.toggle("visible", query.length > 0);

      if (!query) {
        var base = aplicarFiltros(docs);
        if (els.fPilar.value || els.fTipo.value) {
          renderizar(base.slice(0, 50), []);
        } else {
          renderizarEstadoInicial(docs.length);
        }
        return;
      }

      var termos = engine.termosNormalizados(query);
      var ranking = engine.buscar(query);
      var candidatos = ranking.map(function (r) { return docs[r.idx]; });
      var filtrados = aplicarFiltros(candidatos).slice(0, 40);
      renderizar(filtrados, termos);
    }

    els.q.addEventListener("input", function () {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(executar, 120);
    });
    els.fPilar.addEventListener("change", executar);
    els.fTipo.addEventListener("change", executar);
    els.clear.addEventListener("click", function () {
      els.q.value = "";
      executar();
      els.q.focus();
    });

    executar();
  }
})();
</script>
</body>
</html>
